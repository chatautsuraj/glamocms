# Render Blueprint — one-click Nest API + Postgres for Glamo Phase 1 live
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: glamo-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: glamo-db
          property: connectionString
      - key: PORT
        value: "3001"
      - key: API_KEYS
        generateValue: true
      - key: DELIVERY_PARTNER
        value: stub

databases:
  - name: glamo-db
    plan: free
    databaseName: glamo
    user: glamo
