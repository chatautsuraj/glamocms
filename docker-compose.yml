services:
  postgres:
    image: postgres:16-alpine
    container_name: glamo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: glamo
      POSTGRES_PASSWORD: glamo
      POSTGRES_DB: glamo
    volumes:
      - glamo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glamo -d glamo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: glamo-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://glamo:glamo@postgres:5432/glamo?schema=public
      PORT: "3001"
      API_KEYS: pos-local-dev,n8n-local,vercel-bff
      DELIVERY_PARTNER: stub
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  glamo_pg_data:
